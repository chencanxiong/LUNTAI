<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/static/icon.svg">
<title>轮胎型号工作台</title>
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-brand">
    <span class="header-logo">🛞</span>
    <span class="header-title">轮胎型号工作台</span>
  </div>
  <div class="header-actions">
    <span id="authBadge" class="chip-btn">云端只读</span>
    <button id="btnSettings" class="chip-btn" title="管理设置">⚙</button>
  </div>
</header>

<main id="pageList" class="page">
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" class="search-input" placeholder="搜索轮胎型号..." autocomplete="off">
  </div>
  <div class="filter-bar">
    <select id="filterType" class="input filter-select" title="类型筛选">
      <option value="all">全部</option>
      <option value="image">含图片</option>
      <option value="video">含视频</option>
    </select>
    <select id="filterSort" class="input filter-select" title="排序">
      <option value="time">按更新时间</option>
      <option value="name">按名称</option>
    </select>
  </div>
  <div id="modelList" class="list"></div>
  <div id="emptyTip" class="empty-tip hidden">
    <div class="empty-icon">🛞</div>
    <p>暂无型号数据</p>
    <p class="empty-sub">主设备在本地工作台添加数据并发布后，此处自动更新</p>
  </div>
</main>

<section id="pageDetail" class="page page-detail hidden">
  <div class="sub-header">
    <button id="btnBackDetail" class="back-btn">‹</button>
    <div id="detailTitle" class="sub-title"></div>
    <button id="btnDeleteModel" class="chip-btn chip-danger delete-required hidden">删除型号</button>
    <button id="btnDownloadZip" class="chip-btn chip-primary">打包</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="images">照片</button>
    <button class="tab" data-tab="videos">视频</button>
  </div>
  <div id="detailContent" class="detail-content"></div>
</section>

<div id="toast" class="toast hidden"></div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-mask" data-close="settings"></div>
  <div class="modal-body">
    <h3 class="modal-title">管理设置</h3>
    <p class="modal-tip">填写 GitHub 个人访问 Token（需仓库读写权限）后可删除云端数据。Token 仅保存在本机浏览器 localStorage。</p>
    <input type="password" id="ghTokenInput" class="input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <div class="modal-actions">
      <button id="btnSaveToken" class="chip-btn chip-primary">保存</button>
      <button id="btnClearToken" class="chip-btn chip-danger">清除</button>
      <button class="chip-btn" data-close="settings">关闭</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
